version: 2
updates:
  - package-ecosystem: "pip"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    directory: "/"
    groups:
      pip-patches:
        exclude-patterns: ["pytest*"]
        update-types: ["patch"]
      pip-minors:
        exclude-patterns: ["pytest*"]
        update-types: ["minor"]
      pip-pytest:
        patterns: ["pytest*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "python"
      - "dependencies"
      - "automerge"

  - package-ecosystem: "npm"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    directory: "/vue3/"
    groups:
      npm-patches:
        patterns: ["*"]
        update-types: ["patch"]
      npm-minors:
        patterns: ["*"]
        update-types: ["minor"]
    ignore:
      # @types/node tracks Node major versions. The project is pinned to
      # Node 24 LTS (vue3/package.json "engines", .nvmrc) — stay on the
      # matching 24.x types line rather than drifting ahead to an
      # unreleased/Current major's typings.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # typescript 7 doesn't yet expose a stable programmatic API, so
      # Volar-based tooling (vue-tsc) can't embed it — confirmed broken
      # (vuejs/language-tools#5381, #6124) and TypeScript's own team
      # recommends Vue projects stay on 6.0 until that's resolved. Revisit
      # once vue-tsc ships TS7 support.
      - dependency-name: "typescript"
        versions: [">=7"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "javascript"
      - "dependencies"
      - "automerge"

  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    directory: "/"
    groups:
      actions-updates:
          patterns: ["*"]
          update-types: ["patch", "minor"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "github_actions"
      - "dependencies"
      - "automerge"

  - package-ecosystem: "docker"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    directory: "/"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "docker"
      - "dependencies"
      - "automerge"
    ignore:
      # Held on python 3.13 on purpose. The old reason (litellm's
      # Requires-Python <3.14) no longer applies: litellm allows <3.15 and the
      # 3.14 CI canary passes. Lift this once the docker-build check is a
      # required status check, so an auto-merged Python bump cannot reach
      # docker-publish without its Alpine image build having passed first.
      - dependency-name: "python"
        versions: [">=3.14"]

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "devcontainers"
      - "dependencies"
      - "automerge"
