version: 2
updates:
  - package-ecosystem: "pip"
    open-pull-requests-limit: 20
    schedule:
      interval: "daily"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    directory: "/"
    groups:
      pip-patches:
        exclude-patterns: ["pytest*"]
        update-types: ["patch"]
      pip-minors:
        exclude-patterns: ["pytest*"]
        update-types: ["minor"]
      pip-pytest:
        patterns: ["pytest*"]
        update-types: ["minor", "patch"]
    ignore:
      # litellm 1.83.1+ tightens its transitive pin to python-dotenv==1.0.1,
      # which conflicts with our pinned python-dotenv==1.2.2. Skip the 1.83.x
      # patch tail and wait for the next minor (1.84+) to re-evaluate.
      - dependency-name: "litellm"
        versions: [">=1.83.1, <1.84"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "python"
      - "dependencies"
      - "automerge"

  - package-ecosystem: "npm"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    directory: "/vue3/"
    groups:
      npm-patches:
        patterns: ["*"]
        update-types: ["patch"]
      npm-minors:
        patterns: ["*"]
        update-types: ["minor"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "javascript"
      - "dependencies"
      - "automerge"

  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    directory: "/.github/"
    groups:
      actions-updates:
          patterns: ["*"]
          update-types: ["patch", "minor"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "github_actions"
      - "dependencies"
      - "automerge"

  - package-ecosystem: "docker"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    directory: "/"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "docker"
      - "dependencies"
      - "automerge"
    ignore:
      # python 3.14+ is incompatible with our pinned litellm (Requires-Python
      # <3.14). Stay on 3.13 until litellm supports 3.14 (dependabot #719).
      - dependency-name: "python"
        versions: [">=3.14"]

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "devcontainers"
      - "dependencies"
      - "automerge"
