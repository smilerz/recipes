name: Continuous Integration

on:
    # PRs only: a push trigger as well would run everything twice per commit.
    pull_request:
    workflow_call:

jobs:
    build:
        runs-on: ubuntu-latest
        # Experimental matrix entries (e.g. python 3.14) are allowed to fail
        # without failing the CI run or blocking merges.
        continue-on-error: ${{ matrix.experimental || false }}
        strategy:
            fail-fast: false
            max-parallel: 4
            matrix:
                # Node 24 is the project's pinned LTS version (see
                # vue3/package.json "engines" and .nvmrc) — odd-numbered
                # ("Current", non-LTS) lines aren't required here.
                python-version: ["3.13"]
                node-version: ["24"]
                include:
                    # 3.14 is the Python the Docker image runs, so it is tested like 3.13.
                    # Add `experimental: true` to an entry to let it fail without blocking.
                    - python-version: "3.14"
                      node-version: "24"
        steps:
            - uses: actions/checkout@v7
              with:
                  # Full history: the diff-coverage step diffs against the PR's base branch.
                  fetch-depth: 0
            # cache-apt-pkgs-action >=1.6.3 no longer runs `apt update` on GitHub runners, so a
            # cache-cold install resolves against the runner image's stale lists and 404s.
            - name: Refresh apt package lists
              # apt-get update normally takes seconds but can hang on the runner's mirrors; fail fast so a re-run is quick.
              timeout-minutes: 5
              run: sudo apt-get update
            - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
              with:
                  packages: libsasl2-dev python3-dev libxml2-dev libxmlsec1-dev libxslt-dev libxmlsec1-openssl libxslt-dev libldap2-dev libssl-dev gcc musl-dev postgresql-dev zlib-dev jpeg-dev libwebp-dev openssl-dev libffi-dev cargo openldap-dev python3-dev xmlsec-dev xmlsec build-base g++ curl
                  version: 1.0

            # Setup python & dependencies
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: "pip"

            - name: Install Python Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Cache StaticFiles
              uses: actions/cache@v6
              id: django_cache
              with:
                  path: |
                      ./cookbook/static
                      ./staticfiles
                  key: |
                      ${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.node-version }}-collectstatic-${{ hashFiles('**/*.css', '**/*.js', 'vue3/src/*') }}

            # Build Vue frontend & Dependencies
            - name: Set up Node ${{ matrix.node-version }}
              if: steps.django_cache.outputs.cache-hit != 'true'
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "yarn"
                  cache-dependency-path: ./vue3/yarn.lock

            - name: Install Vue dependencies
              if: steps.django_cache.outputs.cache-hit != 'true'
              working-directory: ./vue3
              run: yarn install

            - name: Build Vue dependencies
              if: steps.django_cache.outputs.cache-hit != 'true'
              working-directory: ./vue3
              run: yarn build

            - name: Compile Django StaticFiles
              if: steps.django_cache.outputs.cache-hit != 'true'
              run: |
                  python3 manage.py collectstatic --noinput

            - uses: actions/cache/save@v6
              if: steps.django_cache.outputs.cache-hit != 'true'
              with:
                  path: |
                      ./cookbook/static
                      ./staticfiles
                  key: |
                      ${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.node-version }}-collectstatic-${{ hashFiles('**/*.css', '**/*.js', 'vue/src/*') }}

            - name: Django Testing project
              run: pytest --junitxml=junit/test-results-${{ matrix.python-version }}.xml

            # Tests for the lines a PR changes are mandatory: fail when under 80% of the changed
            # lines are executed by a test. Tests and migrations are excluded so their own
            # (always-executed) changed lines can't dilute the ratio.
            - name: Diff coverage (changed backend lines must be tested)
              if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  pip install diff-cover==10.6.0
                  status=0
                  diff-cover docs/reports/coverage/coverage.xml \
                      --compare-branch="origin/$BASE_REF" \
                      --fail-under=80 \
                      --exclude "**/tests/**" "**/migrations/**" \
                      --format markdown:diff-coverage.md || status=$?
                  cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
                  exit $status

            # One upload per push/PR is enough - coverage doesn't vary by matrix leg.
            - name: Upload backend coverage to Codecov
              if: matrix.python-version == '3.13' && matrix.node-version == '24'
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./docs/reports/coverage/coverage.xml
                  flags: backend
                  fail_ci_if_error: false
