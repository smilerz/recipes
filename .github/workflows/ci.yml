name: Continuous Integration

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ "main", "master", "working" ]

# Cancel redundant runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # 3.13 CI disabled due until https://github.com/TandoorRecipes/recipes/issues/3784 resolved
        # python-version: ["3.12", "3.13"]
        python-version: ["3.12"]
        node-version: ["18", "20"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: awalsh128/cache-apt-pkgs-action@44c33b32f808cdddd5ac0366d70595ed63661ed8  # v1.5.0
        with:
          packages: libsasl2-dev python3-dev libxml2-dev libxmlsec1-dev libxslt-dev libxmlsec1-openssl libldap2-dev libssl-dev gcc musl-dev postgresql-dev zlib-dev jpeg-dev libwebp-dev openssl-dev libffi-dev cargo openldap-dev python3-dev xmlsec-dev xmlsec build-base g++ curl
          version: 1.0

      # Setup python & dependencies
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@532b046aaf352bab5717122cc0ea52b7f12266a3  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache StaticFiles
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a  # v4.1.2
        id: django_cache
        with:
          path: |
            ./cookbook/static
            ./vue/webpack-stats.json
            ./staticfiles
          key: |
            ${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.node-version }}-collectstatic-${{ hashFiles('**/*.css', '**/*.js', 'vue/src/*') }}

      # Build Vue frontend & Dependencies
      - name: Set up Node ${{ matrix.node-version }}
        if: steps.django_cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@08f58d1471bff7f3a07d167b4ad7df25d5fcfcb6  # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
          cache-dependency-path: ./vue/yarn.lock

      - name: Install Vue dependencies
        if: steps.django_cache.outputs.cache-hit != 'true'
        working-directory: ./vue
        run: yarn install

      - name: Build Vue dependencies
        if: steps.django_cache.outputs.cache-hit != 'true'
        working-directory: ./vue
        run: yarn build

      - name: Compile Django StaticFiles
        if: steps.django_cache.outputs.cache-hit != 'true'
        run: |
          python3 manage.py collectstatic --noinput
          python3 manage.py collectstatic_js_reverse

      - uses: actions/cache/save@640a1c2554105b57832a23eea0b4672fc7a790d5  # v4.1.2
        if: steps.django_cache.outputs.cache-hit != 'true'
        with:
          path: |
            ./cookbook/static
            ./vue/webpack-stats.json
            ./staticfiles
          key: |
            ${{ runner.os }}-${{ matrix.python-version }}-${{ matrix.node-version }}-collectstatic-${{ hashFiles('**/*.css', '**/*.js', 'vue/src/*') }}

      # Testing
      - name: Django Testing
        run: pytest --junitxml=junit/test-results-${{ matrix.python-version }}.xml

      # Upload test results
      - name: Upload Test Results
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8  # v4.5.0
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}-${{ matrix.node-version }}
          path: junit/test-results-*.xml
          retention-days: 7