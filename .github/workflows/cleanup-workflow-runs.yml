name: Cleanup Workflow Runs

# Weekly cleanup of old GitHub Actions workflow runs per the retention matrix
# at .claude/plans/workflow-run-cleanup.md. Uses Mattraks/delete-workflow-runs
# to target each workflow with its own retention policy. Schedule triggers
# from the default branch (preview) — gotcha documented in
# .claude/rules/github-actions.md.
#
# Manual run: workflow_dispatch with dry_run=true to audit before deleting.
#
# Retention semantics: the per-workflow steps deletes runs older than
# retain_days and keep the most recent keep_minimum_runs regardless of age.
# NO conclusion filter on those steps — earlier versions filtered to
# "cancelled,skipped,failure" which excluded success runs, letting them
# accumulate indefinitely (894 ci.yml runs in the wild). The action's
# retain_days/keep_minimum_runs already guarantee a sliding window for the
# success/failure history we want to keep.
#
# Skipped runs are the exception: they are pure noise on this fork. Upstream
# jobs gated `if: github.repository_owner == 'TandoorRecipes'` (build-docker
# everywhere; ci/codeql on chain branches) skip on every push, manufacturing
# a skipped run that never did any work. Age-based retention can't clear them
# — with keep_minimum_runs=10 the action protects the 10 most-recent of the
# over-age subset, so old skipped runs survive indefinitely. The dedicated
# "Cleanup ALL skipped runs" step below deletes every skipped run across every
# workflow regardless of age (retain_days=0, keep_minimum_runs=0).

on:
  schedule:
    - cron: '0 6 * * 0'  # Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (audit counts without deleting)'
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # CI on PRs — PRs churn fast; keep recent for blame.
      - name: Cleanup ci.yml runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 10
          delete_workflow_pattern: ci.yml
          dry_run: ${{ inputs.dry_run || false }}

      # vue-ci.yml — same rationale as ci.yml; per-branch Vitest CI.
      - name: Cleanup vue-ci.yml runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 10
          delete_workflow_pattern: vue-ci.yml
          dry_run: ${{ inputs.dry_run || false }}

      # docker-publish.yml — preview-exclusive image publish; deployment
      # history. Renamed from docker-build-preview.yml in 0b4feb889.
      - name: Cleanup docker-publish.yml runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 90
          keep_minimum_runs: 20
          delete_workflow_pattern: docker-publish.yml
          dry_run: ${{ inputs.dry_run || false }}

      # build-docker.yml — fork-specific Docker build on PRs/pushes; runs
      # frequently (same cadence as ci.yml). Was missing from cleanup,
      # accumulated 632 runs by 2026-05-28.
      - name: Cleanup build-docker.yml runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 10
          delete_workflow_pattern: build-docker.yml
          dry_run: ${{ inputs.dry_run || false }}

      # CodeQL security scans — fires on every push, not just weekly, so
      # retain_days: 60 kept 900+ runs (only 13 deleted per cycle). Tightened
      # to 14 days; recent scans are what matter for security trending.
      - name: Cleanup codeql-analysis.yml runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 10
          delete_workflow_pattern: codeql-analysis.yml
          dry_run: ${{ inputs.dry_run || false }}

      # dependabot-automerge — initially deferred ("first 2 cycles") but
      # the workflow has been stable since 2026-04-23 (3+ weeks); 504 runs
      # accumulated by 2026-04-27. Treat like CI churn.
      - name: Cleanup dependabot-automerge.yml runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 10
          delete_workflow_pattern: dependabot-automerge.yml
          dry_run: ${{ inputs.dry_run || false }}

      # GitHub dynamic workflows — these have no yml files in the repo; the
      # action matches them by path substring. Both fire on every push/PR and
      # accumulated 1779 + 659 runs by 2026-05-28 with no cleanup at all.
      - name: Cleanup auto-submission runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 5
          delete_workflow_pattern: auto-submission
          dry_run: ${{ inputs.dry_run || false }}

      - name: Cleanup dependabot-updates runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 5
          delete_workflow_pattern: dependabot-updates
          dry_run: ${{ inputs.dry_run || false }}

      # Orphaned runs from deleted branches/workflows — always safe to purge.
      # The 2026-04-26 run cleared 714 orphans from the now-deleted
      # preview-orchestrator.yml + docker-build-preview.yml; future runs
      # should find few orphans unless we delete more workflow files.
      - name: Cleanup runs from deleted workflows
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_workflow_by_state_pattern: "deleted"
          dry_run: ${{ inputs.dry_run || false }}

      # ALL skipped runs, every workflow, any age. delete_workflow_pattern is
      # omitted so the action spans every workflow; retain_days/keep_minimum=0
      # so nothing is protected; the conclusion filter limits deletion to
      # skipped runs only — success/failure history is untouched here and
      # still governed by the per-workflow retention steps above.
      - name: Cleanup ALL skipped runs (any workflow, any age)
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: skipped
          dry_run: ${{ inputs.dry_run || false }}

      - name: Summary
        run: |
          echo "## Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run**: \`${{ inputs.dry_run || false }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Per-step deletion counts are in the Mattraks/delete-workflow-runs action outputs above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Retention policy: see \`.claude/plans/workflow-run-cleanup.md\`." >> $GITHUB_STEP_SUMMARY
