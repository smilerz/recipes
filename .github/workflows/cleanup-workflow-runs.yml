name: Cleanup Workflow Runs

# Weekly cleanup of old GitHub Actions workflow runs per the retention matrix
# at .claude/plans/workflow-run-cleanup.md. Uses Mattraks/delete-workflow-runs
# to target each workflow with its own retention policy. Schedule triggers
# from the default branch (preview) — gotcha documented in
# .claude/rules/github-actions.md.
#
# Manual run: workflow_dispatch with dry_run=true to audit before deleting.

on:
  schedule:
    - cron: '0 6 * * 0'  # Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (audit counts without deleting)'
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # CI on PRs — PRs churn fast; keep recent for blame; always drop
      # cancelled/skipped/failure noise.
      - name: Cleanup ci.yml runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 10
          delete_workflow_pattern: ci.yml
          delete_run_by_conclusion_pattern: "cancelled,skipped,failure"
          dry_run: ${{ inputs.dry_run || false }}

      # vue-ci.yml — same rationale as ci.yml; per-branch Vitest CI.
      - name: Cleanup vue-ci.yml runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 10
          delete_workflow_pattern: vue-ci.yml
          delete_run_by_conclusion_pattern: "cancelled,skipped,failure"
          dry_run: ${{ inputs.dry_run || false }}

      # Preview orchestrator — deployment history; keep both successes and
      # failures long.
      - name: Cleanup preview-orchestrator.yml runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 90
          keep_minimum_runs: 20
          delete_workflow_pattern: preview-orchestrator.yml
          delete_run_by_conclusion_pattern: "cancelled,skipped"
          dry_run: ${{ inputs.dry_run || false }}

      # Docker build preview — same retention as orchestrator since it's the
      # actual publish step.
      - name: Cleanup docker-build-preview.yml runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 90
          keep_minimum_runs: 20
          delete_workflow_pattern: docker-build-preview.yml
          delete_run_by_conclusion_pattern: "cancelled,skipped"
          dry_run: ${{ inputs.dry_run || false }}

      # CodeQL security scans — keep a long tail of green/red for trending.
      - name: Cleanup codeql-analysis.yml runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 60
          keep_minimum_runs: 30
          delete_workflow_pattern: codeql-analysis.yml
          delete_run_by_conclusion_pattern: "cancelled,skipped"
          dry_run: ${{ inputs.dry_run || false }}

      # Orphaned runs from deleted branches — always safe to purge.
      - name: Cleanup runs from deleted branches
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_workflow_by_state_pattern: "deleted"
          dry_run: ${{ inputs.dry_run || false }}

      # dependabot-automerge excluded for the first 2 cycles (workflow is new
      # — we want to observe it before auto-pruning). Re-enable with its own
      # step after 2026-05-07.

      - name: Summary
        run: |
          echo "## Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run**: \`${{ inputs.dry_run || false }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Per-step deletion counts are in the Mattraks/delete-workflow-runs action outputs above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Retention policy: see \`.claude/plans/workflow-run-cleanup.md\`." >> $GITHUB_STEP_SUMMARY
