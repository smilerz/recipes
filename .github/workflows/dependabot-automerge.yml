name: Dependabot Auto-merge

# Approves dependabot PRs and enables native GitHub auto-merge.
#
# The bot App (smilerz-merge-bot) is listed as a pull-request bypass actor
# in the branch ruleset, but GitHub's `--auto` precheck still hard-blocks
# on REVIEW_REQUIRED — bypass only applies when the App initiates the merge
# directly, not when it queues `--auto`. So this workflow leaves an explicit
# approval review and then enables auto-merge.
#
# Hardening:
#  - user.login == 'dependabot[bot]' (PR must be authored by dependabot)
#  - head.repo.full_name == github.repository (reject fork-originated
#    "dependabot" PRs — the 2024–2026 "Weaponizing Dependabot" class)
#  - head.ref starts with 'dependabot/' (belt-and-suspenders)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.pull_request.labels.*.name, 'automerge') && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Remove automerge label
        uses: actions-ecosystem/action-remove-labels@d05162525702062b6bdef750ed8594fc024b3ed7  # v1.3.0
        with:
          labels: automerge

      - name: Add invalid label
        uses: actions-ecosystem/action-add-labels@1a9c3715c0037e96b97bb38cb4c4b56a1f1d4871  # v1.1.0
        with:
          labels: invalid

      - name: Comment restriction
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043  # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ⚠️ **Automerge Restriction Notice**

            The `automerge` label has been removed from this PR because it has restricted use. Only PRs created by `dependabot[bot]` are allowed to use the automerge functionality.

            If you believe this is an error, please contact a repository maintainer.

  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && startsWith(github.event.pull_request.head.ref, 'dependabot/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Auto-approve PR
        uses: hmarr/auto-approve-action@b40d6c9ed2fa10c9a2749eca7eb004418a705501  # v4.0.0
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          review-message: |
            🤖 **Dependabot Auto-merge**

            Approved by smilerz-merge-bot. Will merge automatically once required checks pass.

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          # Use squash, not rebase. The update-branch REST API (used to bring
          # a stale dependabot PR up to date) creates a merge commit on top
          # of the dependabot branch — `--rebase` then fails with
          # "This branch can't be rebased" because the merge commit can't be
          # linearly replayed. Squash flattens the head into a single commit
          # on base regardless of merge commits.
          gh pr merge --auto --squash \
            "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"
