name: Kick Dependabot Rebases on Preview Push

# Dependabot PRs go stale when preview advances: branch protection requires
# "up to date" so their already-enabled auto-merge can't fire until the
# branch is updated. This workflow calls GitHub's `update-branch` REST API
# to merge preview into each open dependabot PR head. GitHub's auto-merge
# then completes the PR when checks pass.
#
# CRITICAL: use the bot App token (smilerz-merge-bot), NOT GITHUB_TOKEN.
# Pushes made by github-actions[bot] deliberately do NOT trigger new workflow
# runs (GitHub's loop-protection). That leaves the updated PR stuck in
# action_required. Bot-App pushes are treated as a trusted external identity
# and do trigger workflows normally — so CI re-runs, and auto-merge fires.

on:
  push:
    branches: [preview]

permissions:
  contents: read
  pull-requests: read

jobs:
  kick-rebases:
    runs-on: ubuntu-latest
    steps:
      # Dependabot only accepts @dependabot commands from users with push
      # access. Default GITHUB_TOKEN is github-actions[bot] which is read-only
      # from dependabot's perspective. Generate a bot-App token instead (same
      # credentials as dependabot-automerge.yml).
      - name: Generate bot token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Comment @dependabot rebase on every open dependabot PR
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          gh pr list --repo "$REPO" --state open --limit 50 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("dependabot/")) | .number' \
          | while read -r pr; do
              echo "Updating PR #$pr branch"
              gh api --method PUT "/repos/$REPO/pulls/$pr/update-branch" \
                --header "Accept: application/vnd.github+json" \
                || echo "  (update failed — continuing)"
            done
