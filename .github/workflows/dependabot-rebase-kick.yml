name: Kick Dependabot Rebases on Preview Push

# Dependabot PRs go stale when preview advances: branch protection requires
# "up to date" so their already-enabled auto-merge can't fire until they're
# rebased. This workflow kicks `@dependabot rebase` on every open dependabot
# PR after each preview push, so the queue drains serially instead of
# stalling indefinitely.
#
# Fires on the same event as preview-orchestrator but runs in parallel —
# kick comments are cheap, no coordination needed.

on:
  push:
    branches: [preview]

permissions:
  pull-requests: write
  contents: read

jobs:
  kick-rebases:
    runs-on: ubuntu-latest
    steps:
      # Dependabot only accepts @dependabot commands from users with push
      # access. Default GITHUB_TOKEN is github-actions[bot] which is read-only
      # from dependabot's perspective. Generate a bot-App token instead (same
      # credentials as dependabot-automerge.yml).
      - name: Generate bot token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Comment @dependabot rebase on every open dependabot PR
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          gh pr list --repo "$REPO" --state open --limit 50 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("dependabot/")) | .number' \
          | while read -r pr; do
              echo "Kicking rebase on PR #$pr"
              gh pr comment "$pr" --repo "$REPO" --body "@dependabot rebase" \
                || echo "  (comment failed — continuing)"
            done
