name: Vue Continuous Integration

on:
  # PRs only: a push trigger as well would run everything twice per commit.
  pull_request:
  workflow_call:

jobs:
  vue-tests:
    runs-on: ubuntu-latest
    # Node 24 is the project's pinned LTS version (see vue3/package.json
    # "engines" and .nvmrc). Odd-numbered Node lines ("Current", non-LTS)
    # aren't supported by npm's own CLI-team tooling packages (e.g. nopt
    # 10.x explicitly excludes 25.x in its engines field) and shouldn't be
    # required here either.
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the diff-coverage step diffs against the PR's base branch.
          fetch-depth: 0

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
          cache-dependency-path: ./vue3/yarn.lock

      - name: Install Vue dependencies
        working-directory: ./vue3
        run: yarn install

      - name: Run Vue tests
        working-directory: ./vue3
        run: yarn test:coverage

      # Tests for the lines a PR changes are mandatory: fail when under 80% of the changed lines
      # are executed by a test. lcov paths are relative to vue3/ while git's are relative to the
      # repo root, so prefix them or diff-cover matches nothing and silently passes.
      - name: Diff coverage (changed frontend lines must be tested)
        if: github.event_name == 'pull_request' && matrix.node-version == '24'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          sed 's#^SF:#SF:vue3/#' vue3/coverage/lcov.info > lcov-repo-root.info
          status=0
          pipx run --spec diff-cover==10.6.0 diff-cover lcov-repo-root.info \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=80 \
            --format markdown:diff-coverage.md || status=$?
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Dev server health check
        working-directory: ./vue3
        run: yarn healthcheck

      # One upload per push/PR is enough - coverage doesn't vary by Node version.
      - name: Upload frontend coverage to Codecov
        if: matrix.node-version == '24'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./vue3/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
