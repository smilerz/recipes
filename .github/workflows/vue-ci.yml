name: Vue Continuous Integration

on:
  # PRs only: a push trigger as well would run everything twice per commit.
  pull_request:
  workflow_call:

jobs:
  vue-tests:
    runs-on: ubuntu-latest
    # Node 24 is the project's pinned LTS version (see vue3/package.json
    # "engines" and .nvmrc). Odd-numbered Node lines ("Current", non-LTS)
    # aren't supported by npm's own CLI-team tooling packages (e.g. nopt
    # 10.x explicitly excludes 25.x in its engines field) and shouldn't be
    # required here either.
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the diff-coverage step diffs against the PR's base branch.
          fetch-depth: 0

      # A path filter on the workflow would leave the required vue-tests check pending forever on PRs that do not
      # touch the frontend, so the job always runs and skips its steps instead (a skipped step leaves the job, and
      # the check, green) - the same pattern as docker-build-check.yml. Only a pull_request has a base to diff
      # against; any other caller (workflow_call) always runs everything.
      - name: Does this PR touch the frontend?
        id: relevant
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "vue=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # On pull_request the checkout is the merge commit, so HEAD^1 is the base branch.
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          # (captured, not piped into grep -q: an early-closed pipe fails the pipeline under pipefail)
          relevant=$(echo "$changed" | grep -E '^(vue3/|\.nvmrc$|\.github/workflows/vue-ci\.yml$)' || true)
          if [ -n "$relevant" ]; then
            echo "vue=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "vue=false" | tee -a "$GITHUB_OUTPUT"
            echo "Nothing the frontend tests depend on changed; skipping."
          fi

      - name: Set up Node ${{ matrix.node-version }}
        if: steps.relevant.outputs.vue == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
          cache-dependency-path: ./vue3/yarn.lock

      - name: Install Vue dependencies
        if: steps.relevant.outputs.vue == 'true'
        working-directory: ./vue3
        run: yarn install

      - name: Run Vue tests
        if: steps.relevant.outputs.vue == 'true'
        working-directory: ./vue3
        run: yarn test:coverage

      # Tests for the lines a PR changes are mandatory: fail when under 80% of the changed lines
      # are executed by a test. lcov paths are relative to vue3/ while git's are relative to the
      # repo root, so prefix them or diff-cover matches nothing and silently passes.
      - name: Diff coverage (changed frontend lines must be tested)
        if: steps.relevant.outputs.vue == 'true' && github.event_name == 'pull_request' && matrix.node-version == '24'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          sed 's#^SF:#SF:vue3/#' vue3/coverage/lcov.info > lcov-repo-root.info
          status=0
          pipx run --spec diff-cover==10.6.0 diff-cover lcov-repo-root.info \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=80 \
            --format markdown:diff-coverage.md || status=$?
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Dev server health check
        if: steps.relevant.outputs.vue == 'true'
        working-directory: ./vue3
        run: yarn healthcheck

      # One upload per push/PR is enough - coverage doesn't vary by Node version.
      - name: Upload frontend coverage to Codecov
        if: steps.relevant.outputs.vue == 'true' && matrix.node-version == '24'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./vue3/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
